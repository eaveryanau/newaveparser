name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo_sqlite, ctype, iconv

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate, smoke test, static analysis and tests
        run: composer check

      - name: Audit dependencies
        run: composer audit
        continue-on-error: true
