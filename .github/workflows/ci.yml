name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo_sqlite, ctype, iconv

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Smoke test — Symfony starts
        run: php bin/console list

      - name: Check config is valid
        run: php bin/console debug:config framework